name: Build & Test File Service

on:
  push:
    branches: [ develop, main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/file-service
  SPRING_PROFILES_ACTIVE: test

jobs:
  # ===========================
  # Tests
  # ===========================
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.32
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.ROOT_MYSQL_PASS }}
          MYSQL_DATABASE: file_service
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASS }}
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run unit + integration tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/file_service
          SPRING_DATASOURCE_USERNAME: ${{ secrets.MYSQL_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.MYSQL_PASS }}
        run: mvn clean verify

      - name: Build jar (skip tests)
        env:
          SPRING_PROFILES_ACTIVE: docker
        run: mvn clean package -DskipTests

  # ===========================
  # Docker build & push (dev)
  # ===========================
  docker-develop:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Extract short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build & Push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:dev-latest
            ${{ env.DOCKER_IMAGE }}:dev-${{ env.SHORT_SHA }}

  # ===========================
  # E2E Tests (REAL)
  # ===========================
  e2e-tests:
    runs-on: ubuntu-latest
    needs: docker-develop

    services:
      mysql:
        image: mysql:8.0.32
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.ROOT_MYSQL_PASS }}
          MYSQL_DATABASE: file_service
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASS }}
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Pull File Service image
        run: docker pull ${{ env.DOCKER_IMAGE }}:dev-latest

      - name: Run File Service container
        run: |
          docker run -d --name file-service \
            -p 8087:8087 \
            -e SPRING_PROFILES_ACTIVE=docker \
            -e SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/file_service \
            -e SPRING_DATASOURCE_USERNAME=${{ secrets.MYSQL_USER }} \
            -e SPRING_DATASOURCE_PASSWORD=${{ secrets.MYSQL_PASS }} \
            --network ${{ job.services.mysql.network }} \
            ${{ env.DOCKER_IMAGE }}:dev-latest

      - name: Wait for File Service
        run: |
          for i in {1..30}; do
            curl -fs http://localhost:8087/api/v1/files/health && break
            echo "Waiting for file-service..."
            sleep 5
          done
